spring.application.name=backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Groq LLM Configuration ──────────────────────────────────────────
# Groq is OpenAI-API-compatible. We use the official OpenAI Java SDK pointed
# at Groq's endpoint. Get your free key at https://console.groq.com/keys
groq.api-key=${GROQ_API_KEY}
groq.base-url=https://api.groq.com/openai/v1
# qwen/qwen3.8-27b: production Groq-hosted model, native JSON mode support,
# ~340ms typical response time. Verified working on 2026-09-03.
# (We tried openai/gpt-oss-20b but it's a reasoning model that doesn't
# reliably support response_format=json_object for non-reasoning tasks.)
groq.model=qwen/qwen3.8-27b
groq.temperature=0.2
# Groq responds in <2s typical, so 30s client timeout is more than enough
groq.timeout-seconds=30

# ─── Security: cap request body size (10KB) ──────────────────────────
# LinkedIn posts are 3000 chars max, so 10KB is plenty for JSON wrapping.
server.tomcat.max-http-form-post-size=10KB
server.tomcat.max-swallow-size=10KB
spring.servlet.multipart.max-request-size=10KB
spring.servlet.multipart.max-file-size=10KB

# ─── Security: timeouts ─────────────────────────────────────────────
# Groq client timeout (30s) plus comfortable buffer for connection setup
server.tomcat.connection-timeout=45s

# ─── Logging ────────────────────────────────────────────────────────
logging.level.com.linkedin.poststudio=DEBUG
logging.level.org.springframework.web=INFO
