spring.application.name=backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash
gemini.temperature=0.2

# Security: cap request body size (10KB). Anything larger is rejected by Tomcat.
# LinkedIn posts are 3000 chars max, so 10KB is plenty of headroom for JSON wrapping.
server.tomcat.max-http-form-post-size=10KB
server.tomcat.max-swallow-size=10KB
spring.servlet.multipart.max-request-size=10KB
spring.servlet.multipart.max-file-size=10KB

# Security: timeouts (defense against slow-client / slow-LLM attacks)
# Must be >= Gemini client timeout (180s) so Tomcat doesn't kill the request first
server.tomcat.connection-timeout=200s

# Logging Configuration
logging.level.com.linkedin.poststudio=DEBUG
logging.level.org.springframework.web=INFO
